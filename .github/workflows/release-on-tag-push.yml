name: Release

# The maintainer pushes the v* tag; nothing else triggers a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build:
    name: Build distributions
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # setuptools-scm derives the version from the tags; a shallow clone would yield a dev version
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: "Set up Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the built version equals the tag
        run: |
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          built="$(basename "${wheels[0]}" | cut -d- -f2)"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$expected" ]; then
            echo "built version '$built' does not match tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "built version $built matches tag $GITHUB_REF_NAME"

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Trusted Publishing: no token, user or password
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Out Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Release notes: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
            if [ -f MIGRATION.md ]; then
              echo
              echo "Upgrade guide: [MIGRATION.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/MIGRATION.md)"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md"
