repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock
  #      - id: uv-export

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
        files: ^(src|tests)/.*
        types_or: [ python, pyi ]
      # Run the formatter.
      - id: ruff-format
        files: ^(src|tests)/.*
        types_or: [ python, pyi ]

